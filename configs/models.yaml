models:
  logistic_l2:
    C: [0.01, 1.0, 10.0]
    penalty: 'l2'
    solver: 'lbfgs'
    max_iter: 1000
  random_forest:
    n_estimators: [50, 100]
    max_depth: [3, 5]
  xgboost:
    max_depth: [2, 3]
    min_child_weight: [1.0]
    reg_lambda: [1.0]
    learning_rate: [0.1]
    n_estimators: [50]
  lightgbm:
    max_depth: [2, 3]
    num_leaves: [7]
    reg_lambda: [1.0]
    learning_rate: [0.1]
    n_estimators: [50]
  svm:
    C: [0.1, 1.0, 10.0]
    kernel: ['linear', 'rbf']
  mlp:
    hidden_layer_sizes: [[32], [64, 32]]
    alpha: [0.0001, 0.01]
    learning_rate_init: [0.01]
