experiment_name: smoke_test
seed: 42

data:
  start_date: "1980-01-01"
  end_date: null
  frequency: monthly

targets:
  horizons: [3, 6, 12]   # BẮT BUỘC đủ 3 horizons

validation:
  initial_train_end: "2005-12-01"
  test_start: "2006-01-01"
  test_end: null
  test_size_months: 24    # lớn hơn main để chạy nhanh
  gap_equals_horizon: true

feature_sets:
  - core_econometric      # chỉ 1-2 feature set để chạy nhanh
  - yield_only

models:
  - yield_only_logit
  - logistic_l2
  - random_forest
  - hybrid_ensemble       # phải có để verify C1

metrics: [roc_auc, pr_auc, brier, log_loss, ece, f1]

thresholds:
  fixed: [0.15, 0.25, 0.35]

bootstrap:
  enabled: true
  block_size: 6
  n_boot: 50              # nhỏ để chạy nhanh

explainability:
  shap_enabled: true
  shap_model: "random_forest"
  shap_horizon: 6
  recession_episodes:
    - {name: "2008", start: "2007-12-01", end: "2009-06-30"}
    - {name: "2020", start: "2020-02-01", end: "2020-04-30"}

outputs:
  save_predictions: true
  save_tables: true
  save_figures: true
  save_split_diagnostics: true
